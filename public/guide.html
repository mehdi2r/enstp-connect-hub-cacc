<style>

@layer base{*,::before,::after{box-sizing:border-box}img,svg,iframe{display:block;max-width:100%}img{height:auto}a{color:inherit}button{background:none;border:0;padding:0;color:inherit;cursor:pointer}nav,aside,main,section,header,footer{display:block}blockquote,cite{margin:0}h1,h2,h3{font-size:inherit;font-weight:inherit}html{-webkit-text-size-adjust:100%}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;height:36px;padding:8px 16px;transition:background-color .2s,color .2s}
.btn svg{width:16px;height:16px;flex-shrink:0;pointer-events:none}
.btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn-icon{width:36px;padding:0}
.btn-hero{background:var(--primary-foreground);color:var(--primary);box-shadow:0 1px 2px rgba(0,0,0,.1)}.btn-hero:hover{background:var(--secondary)}
.btn-hero-outline{border:1px solid color-mix(in oklab,var(--primary-foreground) 40%,transparent);color:var(--primary-foreground);background:transparent}.btn-hero-outline:hover{background:color-mix(in oklab,var(--primary-foreground) 10%,transparent)}
.btn-default{background:var(--primary);color:var(--primary-foreground);box-shadow:0 1px 3px rgba(0,0,0,.15)}.btn-default:hover{background:color-mix(in oklab,var(--primary) 90%,transparent)}
.btn-outline{border:1px solid var(--border);background:var(--background);box-shadow:0 1px 2px rgba(0,0,0,.06)}.btn-outline:hover{background:var(--accent)}
.btn-ghost:hover{background:var(--accent)}
.contents{display:contents}.inline{display:inline}.ml-2{margin-left:8px}.mr-1{margin-right:4px}.mt-3{margin-top:12px}.h-64{height:16rem}.w-full{width:100%}.rounded-xl{border-radius:12px}.border{border:1px solid var(--border)}.size-4{width:16px;height:16px}
.nf-title{font-size:64px;font-weight:800;color:var(--primary)}
[dir="rtl"] .ml-2{margin-left:0;margin-right:8px}[dir="rtl"] .mr-1{margin-right:0;margin-left:4px}

.header-inner.locked{display:flex!important;justify-content:space-between;align-items:center}
.auth-page{padding-top:3rem}

.hello{font-size:13px;font-weight:700;color:var(--mint);margin-bottom:12px}
.auth-form select{border:1px solid rgba(0,0,0,.15);border-radius:.75rem;padding:.7rem .9rem;font:inherit;font-weight:400;background:#fff;color:inherit}

[hidden]{display:none!important}

.auth-page{min-height:60vh;display:flex;justify-content:center;padding:4rem 1.25rem}
.auth-card{width:100%;max-width:30rem;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:1.5rem;padding:2rem;box-shadow:0 20px 50px -25px rgba(0,0,0,.25)}

.auth-card>p{opacity:.7;margin-bottom:1.25rem}
.auth-tabs{margin-bottom:1.25rem;display:flex}
.auth-tabs button{flex:1}
.auth-form{display:grid;gap:.9rem}
.auth-form label{display:grid;gap:.35rem;font-weight:600;font-size:.9rem}

.auth-ok{color:#047857}.auth-err{color:#b91c1c}
.auth-actions{display:flex;gap:.75rem;flex-wrap:wrap}
.account-link{font-weight:600;font-size:.9rem;padding:.45rem .8rem;border-radius:999px;border:1px solid rgba(0,0,0,.12)}

/* Keep the brand and fixed-size controls in independent, shrink-safe tracks. */
.site-header{height:auto}
.header-inner{min-height:86px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px;padding:0 32px}
.brand,.brand-name,.desktop-nav{min-width:0}
.brand{white-space:nowrap}
.brand-symbol,.header-actions,.header-tools,.lang-switch,.account-link{flex-shrink:0}
.brand-sub{letter-spacing:0;overflow:hidden;text-overflow:ellipsis}
.desktop-nav{justify-content:center;gap:20px;align-self:stretch;white-space:nowrap}
.desktop-nav svg,.mobile-nav svg{flex-shrink:0}
.header-actions,.header-tools{display:flex;align-items:center;gap:8px}
.account-link{border-color:var(--border);font-size:12px}
.lang-switch button{letter-spacing:0}
.mobile-nav{display:none}

 .mobile-menu{display:inline-flex}

}

}

tle":"Finding your way on campus","short":"Campus","description":"The right landmarks to find your way around ENSTP.","sections":[{"title":"Your starting point","text":"ENSTP Francis Jeanson is located on rue Sidi Garidi, Kouba, Algiers. Look up the school on Google Maps before your first visit."},{"title":"When you arrive","text":"At the entrance, ask for the registrar’s office and the preparatory classes department. They can direct you to your group and rooms."},{"title":"Landmarks to identify","text":"Main entrance, registrar, lecture halls, library, labs and dining areas: note where they are during your first visit."},{"title":"Indoor map","text":"The building map and room-by-room routes still need to be surveyed and validated on site. No unverified indoor route is published."}],"searches":["Locate ENSTP"]},"salles":{"title":"Finding my room","short":"Rooms & classes","description":"Your group, your timetable and good habits.","sections":[{"title":"Start with your timetable","text":"Find your group, the module, the session type (lecture, tutorial or lab) and the room code. Make sure you have the latest version."},{"title":"Can’t find a room or group?","text":"Show your timetable to the preparatory classes department or the registrar. Ask for the building, floor and exact number."},{"title":"Before your first class","text":"Locate your room in advance and keep a copy of your timetable on your phone."},{"title":"Room directory","text":"Room numbers, groups and schedules are not in the project document. They must be confirmed by the school before publication."}]},"services":{"title":"Paperwork, stress-free","short":"Services & paperwork","description":"Know who to ask, at the right time.","sections":[{"title":"Registration or certificate","text":"The registrar is your first point of contact for student documents. Confirm the required papers and procedure with the office."},{"title":"Lost student card","text":"Report the loss to the registrar. Ask about the replacement procedure before preparing your file."},{"title":"Absence or timetable","text":"Contact your department’s secretariat to learn the applicable procedure and deadlines for justification."},{"title":"Teachers and modules","text":"Ask the department for the official list of teachers and their institutional contacts. Personal details are never published without permission."}],"searches":["Visit the official website"]},"manger":{"title":"Eating well on a budget","short":"Food, groceries & pharmacies","description":"Food, groceries and pharmacies around the school.","sections":[{"title":"Around the school","text":"Compare restaurants, bakeries and mini-markets around rue Sidi Garidi. The links below open a map search, not a list of verified addresses."},{"title":"Keep the budget in mind","text":"Check the menu and price before ordering. Ask students in your year for their usual spots."},{"title":"Plan for the evening","text":"Check opening hours directly with the shop and plan your shopping before heading back to the residence."},{"title":"Addresses being collected","text":"Prices, distances and hours will be added after an on-site survey. No shop is presented here as open or recommended without verification."}],"searches":["Nearby restaurants","Bakeries & mini-markets","Pharmacies near school"]},"transport":{"title":"Getting around Algiers","short":"Transport","description":"Plan your trip, from your first class back to the residence.","sections":[{"title":"Plan a trip","text":"Use ENSTP in Kouba as your destination in your map app. Compare the available options from your starting point."},{"title":"Buses and stops","text":"Confirm lines, directions and stops with operators or on site. The project does not provide verified lines or schedules."},{"title":"Getting back","text":"Locate your stop in both directions and check the last departure. Keep a backup option if you finish late."}],"searches":["Plan my route","Find bus stops"]},"sport":{"title":"Move, breathe, repeat","short":"Sports & activities","description":"Student life happens outside class too.","sections":[{"title":"Find the facilities","text":"Ask the school which fields and sports areas are open to students, and the rules for using them."},{"title":"Find your team","text":"Football, running, basketball or walking: ask associations and your classmates about existing activities."},{"title":"An idea: ENSTP Running Club","text":"The document suggests a student running club. It is an idea to organise, not an already confirmed club or calendar."},{"title":"Organise with no budget","text":"Choose an accessible activity, get permission to use the facilities and agree together on a place and time."}]},"vie-etudiante":{"title":"Finding your place","short":"Student life","description":"New encounters, mutual help and new bearings.","sections":[{"title":"Meet your classmates","text":"Start with a study group or a sports activity. Ask older students how to join clubs recognised by the school."},{"title":"Living in residence","text":"Ask your residence about dining, study spaces, services and weekend access conditions."},{"title":"A student mentor","text":"Mentoring between older and new students is an idea from the project. Ask your department whether a scheme already exists."},{"title":"Help between cities","text":"The proposed solidarity network is still to be organised. No money, no forbidden items and no public personal data; member validation and reporting are required before any connection."}]},"alger":{"title":"Algiers, your new city","short":"Discover Algiers","description":"A city to explore, one weekend at a time.","sections":[{"title":"The Jardin d’Essai","text":"An outing idea to discover the Hamma garden. Check access conditions and opening hours before you go."},{"title":"The Casbah & downtown Algiers","text":"Discover the city’s heritage and historic streets. Plan your route and prefer a guided first visit."},{"title":"Notre-Dame d’Afrique","text":"Another destinat روابط أدناه تفتح بحثًا على الخريطة، وليست قائمة عناوين مؤكدة."},{"title":"راعِ ميزانيتك","text":"تحقق من القائمة والسعر قبل الطلب. اسأل زملاءك عن أماكنهم المعتادة."},{"title":"خطط للمساء","text":"تحقق من مواعيد العمل مباشرة لدى المحل وخطط لمشترياتك قبل العودة إلى الإقامة."},{"title":"عناوين قيد الجمع","text":"ستُضاف الأسعار والمسافات والمواعيد بعد تحقيق ميداني. لا يُقدَّم أي محل هنا على أنه مفتوح أو موصى به دون تحقق."}],"searches":["مطاعم قريبة","مخابز ومحلات","صيدليات قرب المدرسة"]},"transport":{"title":"التنقل في الجزائر","short":"النقل","description":"حضّر رحلتك، من أول حصة إلى العودة للإقامة.","sections":[{"title":"تحضير رحلة","text":"استعمل المدرسة في القبة كوجهة في تطبيق الخرائط. قارن الخيارات المتاحة حسب نقطة انطلاقك."},{"title":"الحافلات والمحطات","text":"تأكد من الخطوط والاتجاهات والمحطات لدى المتعاملين أو في الموقع. المشروع لا يوفر خطوطًا أو مواعيد مؤكدة."},{"title":"للعودة","text":"حدد محطتك في الاتجاهين واستعلم عن آخر انطلاق. احتفظ بحل بديل إذا أنهيت متأخرًا."}],"searches":["تحضير مساري","البحث عن محطات الحافلات"]},"sport":{"title":"تحرّك، تنفّس، أعد الكرّة","short":"الرياضة والأنشطة","description":"الحياة الطلابية تُعاش أيضًا خارج الدروس.","sections":[{"title":"معرفة المنشآت","text":"اسأل المدرسة عن الملاعب والفضاءات الرياضية المتاحة للطلبة وقواعد استعمالها."},{"title":"إيجاد فريقك","text":"كرة القدم، الجري، كرة السلة أو المشي: استعلم لدى الجمعيات وزملائك عن الأنشطة الموجودة."},{"title":"فكرة: نادي ENSTP للجري","text":"تقترح الوثيقة ناديًا طلابيًا للجري. إنها فكرة للتنظيم، وليست ناديًا أو رزنامة مؤكدة."},{"title":"التنظيم دون ميزانية","text":"اختر نشاطًا في المتناول، واحصل على الإذن لاستعمال المنشآت، وحددوا معًا مكانًا وموعدًا."}]},"vie-etudiante":{"title":"إيجاد مكانك","short":"الحياة الطلابية","description":"لقاءات وتضامن ومعالم جديدة.","sections":[{"title":"التعرّف على دفعتك","text":"ابدأ بفوج عمل أو نشاط رياضي. اسأل الطلبة القدامى عن كيفية الانضمام إلى النوادي المعترف بها."},{"title":"العيش في الإقامة","text":"استعلم لدى إقامتك عن الإطعام وفضاءات ال document.addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('[data-lang],[data-filter],[data-menu],[data-search],[data-close],[data-map],[data-scroll],[data-signout]') : null;
  if (!el) { return; }
  if (el.hasAttribute('data-lang')) {
    lang = el.getAttribute('data-lang');
    try { localStorage.setItem('enstp-go-lang', lang); } catch (x) {}
    render();
  } else if (el.hasAttribute('data-filter')) {
    st.filter = el.getAttribute('data-filter'); render();
  } else if (el.hasAttribute('data-menu')) {
    st.menu = !st.menu; render();
  } else if (el.hasAttribute('data-search')) {
    st.search = true; st.query = ''; overlay();
  } else if (el.hasAttribute('data-close')) {
    if (el.classList.contains('search-overlay') && e.target !== el) { return; }
    st.search = false; overlay();
  } else if (el.hasAttribute('data-map')) {
    st.map = el.getAttribute('data-map'); render();
  } else if (el.hasAttribute('data-signout')) {
    member = null; profile = null;
    try { localStorage.removeItem('enstp-go-email'); localStorage.removeItem('enstp-go-profile'); } catch (x) {}
    try { window.parent.postMessage({ type: 'enstp-signout' }, location.origin); } catch (x) {}
    if (location.hash && location.hash !== '#/') { location.hash = '#/'; } else { render(); }
  } else if (el.hasAttribute('data-scroll')) {
    e.preventDefault();
    var target = document.getElementById(el.getAttribute('data-scroll'));
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
});
document.addEventListener('input', function (e) {
  if (e.target && e.target.id === 'q') {
    st.query = e.target.value;
    document.getElementById('results').innerHTML = resultsHtml();
  }
});
document.addEventListener('submit', function (e) {
  if (!e.target) { return; }
  if (e.target.id === 'gate-form') {
    e.preventDefault();
    var v = document.getElementById('gate-email').value;
    if (!okEmail(v)) { document.getElementById('gate-err').textContent = GATE[lang].e; return; }
    member = v.trim().toLowerCase();
    try { localStorage.setItem('enstp-go-email', member); } catch (x) {}
    render();
    var pn = document.getElementById('p-name'); if (pn) pn.focus();
  } else if (e.target.id === 'profile-form') {
    e.preventDefault();
    var nm = document.getElementById('p-name').value.trim().replace(/\s+/g, ' ');
    var yr = document.getElementById('p-year').value;
    var yi = yr === '' ? -1 : parseInt(yr, 10);
    var needDept = yi >= 2 && yi <= 4;
    var dv = document.getElementById('p-dept').value;
    if (nm.length < 2 || yi < 0 || (needDept && dv === '')) { document.getElementById('gate-err').textContent = GATE[lang].ne; return; }
    profile = { name: nm.slice(0, 60), year: yi };
    if (needDept) profile.dept = parseInt(dv, 10);
    try { localStorage.setItem('enstp-go-profile', JSON.stringify(profile)); } catch (x) {}
    render();
    window.scrollTo(0, 0);
  }
});
document.addEventListener('change', function (e) {
  if (e.target && e.target.id === 'p-year') {
    var y = e.target.value === '' ? -1 : parseInt(e.target.value, 10);
    var wrap = document.getElementById('dept-wrap');
    if (wrap) { wrap.hidden = !(y >= 2 && y <= 4); if (wrap.hidden) document.getElementById('p-dept').value = ''; }
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && st.search) { st.search = false; overlay(); }
});
document.addEventListener('click', function (e) {
  var a = e.target.closest ? e.target.closest('.search-results a') : null;
  if (a) { st.search = false; overlay(); }
});
window.addEventListener('hashchange', function () {
  st.menu = false; st.search = false; st.map = null;
  render();
  window.scrollTo(0, 0);
});
window.addEventListener('message', function (e) {
  if (e.origin !== location.origin || !e.data) return;
  var frame = e.data.type === 'enstp-ecole-height' ? document.getElementById('schoolFrame') : e.data.type === 'enstp-aide-height' ? document.getElementById('communityFrame') : e.data.type === 'enstp-travel-height' ? document.getElementById('travelFrame') : null;
  if (!frame || e.source !== frame.contentWindow) return;
  if (typeof e.data.height === 'number' && Number.isFinite(e.data.height) && e.data.height > 0 && e.data.height < 50000) frame.style.height = e.data.height + 'px';
});
render();
